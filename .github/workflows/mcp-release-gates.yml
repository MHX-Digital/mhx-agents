name: MCP release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_failure:
        description: "Deliberately fail with disposable fictional fixtures (maintainer validation only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: ""
      - name: Install pinned CI environment
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
          python -m pip install --disable-pip-version-check --no-deps .
          python -m pip check
      - name: Validate runtime and package
        run: |
          python --version
          git --version
          python -m compileall -q src tests scripts
          python -c "import aak; from aak import mcp_server"
      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/check_whitespace.py
      - name: Validate schemas and manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          for path in sorted(Path("schemas").glob("*.json")):
              document = json.loads(path.read_text(encoding="utf-8"))
              validator_for(document).check_schema(document)
          print("schemas_validated")
          PY
      - name: Run complete suite
        run: python -m pytest -q --junitxml=junit-${{ matrix.python }}.xml
      - name: Run critical MCP suites explicitly
        run: >-
          python -m pytest -q
          tests/test_mcp_freshness.py
          tests/test_index_lifecycle.py
          tests/test_mcp_security.py
          tests/test_mcp_integrated_resilience.py
      - name: Run real whitespace rejection canaries
        run: python -m pytest -q tests/test_whitespace_gate.py
      - name: Run synthetic read-only stdio canary
        run: python scripts/ci/smoke_readonly_mcp.py --output "canary-${{ matrix.python }}.json"
      - name: Verify wheel and sdist outside checkout
        run: |
          python -m pip download --only-binary=:all: --requirement requirements-ci.txt --dest "$RUNNER_TEMP/aak-wheelhouse"
          python scripts/ci/check_distributions.py --wheelhouse "$RUNNER_TEMP/aak-wheelhouse" --output "package-${{ matrix.python }}.json"
      - name: Scan tracked files for high-confidence secrets
        run: python scripts/ci/check_secrets.py
      - name: Deliberate failure canary (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.canary_failure
        run: python scripts/ci/failure_canary.py
      - name: Upload sanitized test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-python-${{ matrix.python }}
          path: junit-${{ matrix.python }}.xml
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic package receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-python-${{ matrix.python }}
          path: |
            package-${{ matrix.python }}.json
            canary-${{ matrix.python }}.json
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""
      - name: Install pinned environment and audit tool
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit dependencies without mutation
        run: |
          python -m pip_audit --strict --requirement requirements-ci.txt
          python -m pip_audit --requirement requirements-ci.txt --format cyclonedx-json --output sbom.cdx.json
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
