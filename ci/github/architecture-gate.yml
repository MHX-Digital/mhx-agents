name: architecture-gate

# Reusable workflow (master plan section 8.1 `ci/github/`, section 10.3
# "deterministic gate"). Copy this template into the consumer repository as
# .github/workflows/architecture-gate.yml before calling it locally with:
#
#   jobs:
#     architecture-gate:
#       uses: ./.github/workflows/architecture-gate.yml
#       with:
#         language: typescript   # or python
#
# Assumes the kit is already installed at a fixed path on the runner
# (`/opt/mhx-agents`, matching the `.claude/settings.json`
# hook-command convention documented in the kit README). The operator must
# separately provision and verify that runtime on the self-hosted runner.
# This file lives outside .github/workflows in MHX-Digital/mhx-agents, so it
# cannot be called directly as an external reusable GitHub workflow.
# Copying or reviewing this template does not activate enforcement.
#
# What this checks, mapped to master plan section 10.3:
# - architecture-schema  -> `aak verify` validates project.yaml + ARCHITECTURE_MAP.json
# - architecture-drift   -> `aak verify --language <input>` reruns the scanner and diffs
# - scope-verification   -> `aak verify --staged` against the PR diff (see intent-to-add step)
# - secret-scan          -> gitleaks (swap for another scanner if the org already has one)
# - architecture-duplication -> explicit no-op (see step below): the kit has
#   replay fixtures, but this template does not evaluate a consumer's corpus.
#   Report "not checked" rather than implying active duplication enforcement.

on:
  workflow_call:
    inputs:
      language:
        description: "Scanner language adapter to run for the drift check (typescript|python)"
        required: true
        type: string
      aak-bin:
        description: "Path to the aak console script on the runner"
        required: false
        type: string
        default: "/opt/mhx-agents/bin/aak"

# Least-privilege default: neither job writes to the repo. Reusable workflows
# otherwise inherit whatever permissions the calling workflow's token has,
# which can be broader than this actually needs.
permissions:
  contents: read

jobs:
  architecture-schema-and-drift:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark PR-changed files as staged (scope-verification needs a real git-staged diff)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs -r git add --intent-to-add --
          fi

      - name: aak verify (schema + drift + scope)
        run: |
          "${{ inputs.aak-bin }}" verify \
            --language "${{ inputs.language }}" \
            ${{ github.event_name == 'pull_request' && '--staged' || '' }}

      - name: architecture-duplication (not implemented)
        run: |
          echo "architecture-duplication: this template does not evaluate a consumer golden corpus -- skipping, not passing. See MHX Agents README Scope note." >&2

  secret-scan:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
